name: CI
on:
  push:
    branches: [main, "feat/**", "chore/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest   # has Docker → Testcontainers postgis/postgis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B test
  # Render builds this same Dockerfile; catching a broken image here is cheaper than a failed deploy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fixgo-be:ci .
