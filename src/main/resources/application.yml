spring:
  application:
    name: fixgo-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 60000
      # PostGIS on Supabase lives in the "extensions" schema; keep it on the search path.
      connection-init-sql: SET search_path TO ${DB_SCHEMA:fixgo}, extensions, public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:fixgo}
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:fixgo}
    default-schema: ${DB_SCHEMA:fixgo}
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
logging:
  pattern:
    # rid = per-request id set by RequestLogFilter (also returned as the X-Request-Id header)
    level: "%5p [%X{rid:-}]"
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
fixgo:
  auth:
    issuer: fixgo
    audience: fixgo-api
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    otp-ttl: 5m
    otp-max-attempts: 5
    otp-max-per-target-per-hour: ${OTP_MAX_PER_TARGET_PER_HOUR:5}
    otp-max-per-ip-per-hour: ${OTP_MAX_PER_IP_PER_HOUR:30}
    # Dev only: echo the OTP code in the API response because no SMS provider is chosen yet (BRD §8).
    otp-dev-echo: ${OTP_DEV_ECHO:false}
    # Number of proxies in front of the app that append to X-Forwarded-For (Render: see docs/deploy). 0 = ignore the header.
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:0}
  dispatch:
    pending-confirmation-ttl: 10m
    scheduler-enabled: ${DISPATCH_SCHEDULER:true}
    scheduler-interval-ms: 5000
    # Ignore partners whose last position is older than this (e.g. PT10M). 0s = no limit; turn it on once the
    # partner apps send their position periodically, otherwise idle-but-online partners stop matching.
    location-max-age: ${DISPATCH_LOCATION_MAX_AGE:0s}
  sms:
    # log = only log the delivery attempt (local dev, with OTP_DEV_ECHO) | esms = eSMS.vn REST API (docs/api.md).
    provider: ${SMS_PROVIDER:log}
    esms:
      url: ${ESMS_URL:}
      api-key: ${ESMS_API_KEY:}
      secret-key: ${ESMS_SECRET_KEY:}
      brandname: ${ESMS_BRANDNAME:}
      sms-type: ${ESMS_SMS_TYPE:2}
      sandbox: ${ESMS_SANDBOX:false}
      content-template: ${ESMS_CONTENT_TEMPLATE:}
      timeout: ${ESMS_TIMEOUT:5s}
  catalog:
    # Comma-separated service codes hidden from customers and partners. Towing waits for the hand-over flow (BR04/BR05).
    disabled-codes: ${DISABLED_SERVICE_CODES:towing}
  uploads:
    # Pilot: local disk (git-ignored). Production: Cloudinary (BRD §8).
    dir: ${UPLOADS_DIR:.local/uploads}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://exe201-fix-go.github.io}
  bootstrap-admin:
    phone: ${BOOTSTRAP_ADMIN_PHONE:}
    full-name: ${BOOTSTRAP_ADMIN_NAME:FixGo Admin}
